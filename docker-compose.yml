services:

  # ─── Infrastructure ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    environment:
      POSTGRES_DB: ${DD_DATABASE_NAME:-defectmanagement}
      POSTGRES_USER: ${DD_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:-aiassistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DD_DATABASE_USER:-postgres} -d ${DD_DATABASE_NAME:-defectmanagement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sp-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sp-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sp-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sp-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: sp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sp-network
    restart: unless-stopped

  # Security scanner CLIs (naabu/nuclei/ffuf/...) — shared volume for API
  scanners:
    image: securityportal-scanners:latest
    build:
      context: .
      dockerfile: infrastructure/docker/scanners/Dockerfile
    container_name: sp-scanners
    environment:
      - SCANNER_SHARE_DIR=/shared
      - SCANNERS_ONESHOT=0
    volumes:
      - scanners_data:/shared
    networks:
      - sp-network
    restart: unless-stopped

  # ─── Application Services ─────────────────────────────────
  api:
    image: securityportal-api:2026-08-07.2
    build:
      context: .
      dockerfile: src/services/SecurityPortal.API/Dockerfile
      args:
        BUILD_STAMP: "2026-08-07.2"
    container_name: sp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - SECURITYPORTAL_BUILD_STAMP=2026-08-07.2
      - SCANNER_TOOLS_PATH=/opt/scanners/bin
      - NUCLEI_TEMPLATES_PATH=/opt/scanners/nuclei-templates
      - PYTHONPATH=/opt/scanners/pylib
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-redis}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=SecurityPortal
      - Jwt__Audience=SecurityPortal
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - scanners_data:/opt/scanners:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scanners:
        condition: service_started
    networks:
      - sp-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: src/services/SecurityPortal.Scheduler/Dockerfile
    container_name: sp-scheduler
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: src/services/SecurityPortal.Orchestrator/Dockerfile
    container_name: sp-orchestrator
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-discovery:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.Discovery/Dockerfile
    container_name: sp-worker-discovery
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-network:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.Network/Dockerfile
    container_name: sp-worker-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-web:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.Web/Dockerfile
    container_name: sp-worker-web
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-ssl:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.SSL/Dockerfile
    container_name: sp-worker-ssl
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-fingerprint:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.Fingerprint/Dockerfile
    container_name: sp-worker-fingerprint
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  worker-screenshot:
    build:
      context: .
      dockerfile: src/workers/SecurityPortal.Worker.Screenshot/Dockerfile
    container_name: sp-worker-screenshot
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  report-engine:
    build:
      context: .
      dockerfile: src/services/SecurityPortal.ReportEngine/Dockerfile
    container_name: sp-report-engine
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Minio__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: src/services/SecurityPortal.Notification/Dockerfile
    container_name: sp-notification
    environment:
      - ConnectionStrings__DefaultConnection=Host=${DD_DATABASE_HOST:-postgres};Port=${DD_DATABASE_PORT:-5432};Database=${DD_DATABASE_NAME:-defectmanagement};Username=${DD_DATABASE_USER:-postgres};Password=${DD_DATABASE_PASSWORD:-aiassistant}
      - RabbitMQ__Host=rabbitmq
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: src/services/SecurityPortal.AI/Dockerfile
    container_name: sp-ai
    environment:
      - RabbitMQ__Host=rabbitmq
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sp-network
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sp-nginx
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - sp-network
    restart: unless-stopped

  # ─── Observability ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sp-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - sp-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sp-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - sp-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
  scanners_data:

networks:
  sp-network:
    driver: bridge
