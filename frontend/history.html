<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/?view=history" />
  <title>Chuyển tới lịch sử…</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var target = id ? "/?id=" + encodeURIComponent(id) : "/?view=history";
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Lịch sử nằm ở cột phải trang chủ. Đang chuyển tới <a href="/?view=history">/?view=history</a>…</p>
</body>
</html>
