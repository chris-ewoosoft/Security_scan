<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chuyển tới lịch sử…</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    window.location.replace(id ? `/history.html?id=${encodeURIComponent(id)}` : "/history.html");
  </script>
</head>
<body>
  <p>Chuyển tới <a id="go" href="/history.html">Lịch sử</a>…</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    document.getElementById("go").href = id ? `/history.html?id=${encodeURIComponent(id)}` : "/history.html";
  </script>
</body>
</html>
